<form
  class="mx-2 my-2 flex flex-col gap-3"
  #searchForm="ngForm"
  (ngSubmit)="
    searchForm.valid && itemsService.getItemsByName(mealName.value)
  "
>
  <div class="flex flex-col gap-1">
    <label for="mealName" class="text-sm font-medium text-stone-600">
      Meal Name <span class="text-red-500">*</span>
    </label>
    <input
      ngModel
      #mealName
      type="text"
      class="w-full rounded-lg border border-amber-300 bg-white px-3 py-2 text-stone-700 placeholder-stone-400 transition focus:border-mauve-500 focus:ring-2 focus:ring-mauve-200 focus:outline-none"
      id="mealName"
      name="mealName"
      required
      placeholder="Chicken Handi..."
    />
  </div>
  <div class="flex items-center justify-between gap-3">
    <button
      type="submit"
      class="flex flex-1 cursor-pointer items-center justify-center rounded-lg bg-mauve-600 px-4 py-2 whitespace-nowrap text-amber-50 transition hover:bg-mauve-700 disabled:cursor-not-allowed disabled:opacity-50 md:shrink-0 md:grow-0"
      [disabled]="searchForm.invalid"
    >
      Find Meals
    </button>
  </div>
</form>
