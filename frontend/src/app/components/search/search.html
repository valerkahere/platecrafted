<form
  class="flex flex-col gap-3"
  #searchForm="ngForm"
  (ngSubmit)="
    searchForm.valid && itemsService.getItem(mealName.value)
  "
>
  <div class="flex flex-col gap-1">
    <label for="mealName" class="text-sm font-medium text-stone-600">
      Meal Name <span class="text-red-500">*</span>
    </label>
    <input
      ngModel
      #mealName
      type="text"
      class="w-full rounded-lg border border-amber-300 bg-white px-3 py-2 text-stone-700 placeholder-stone-400 focus:border-mauve-500 focus:outline-none focus:ring-2 focus:ring-mauve-200 transition"
      id="mealName"
      name="mealName"
      required
      placeholder="Chicken Handi..."
    />
  </div>
  <div class="flex justify-between items-center gap-3">
    <button
      type="submit"
      class="bg-mauve-600 text-amber-50 px-4 py-2 rounded-lg hover:bg-mauve-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="searchForm.invalid"
    >
      Find Meals
    </button>
  </div>
</form>
