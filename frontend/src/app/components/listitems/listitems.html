<div class="border border-amber-200 rounded-2xl bg-amber-50 mx-1 p-4">

  @if (itemsService.items()) {
    <h3 class="font-bold text-stone-700">
      Total meals: {{ itemsService.response()?.meals?.length }}
    </h3>
  } @else {
    <h3 class="font-bold text-stone-700">No items found!</h3>
  }

  <div>
    <form
      class="flex flex-col gap-3"
      #deleteForm="ngForm"
      (ngSubmit)="deleteForm.valid && onSubmit()"
    >
      <!-- Input 1: ID -->
      <div class="flex flex-col gap-1">
        <label for="mealID" class="text-sm font-medium text-stone-600">
          Meal ID <span class="text-red-500">*</span>
        </label>
        <input
          [(ngModel)]="id"
          type="text"
          class="w-full rounded-lg border border-amber-300 bg-white px-3 py-2 text-stone-700 placeholder-stone-400 focus:border-mauve-500 focus:outline-none focus:ring-2 focus:ring-mauve-200 transition"
          id="mealID"
          name="mealID"
          required
          placeholder="69c03eecd5b7920faf126ba4"
        />
      </div>

      <!-- Submit Area -->
      <div>
        <button
          type="submit"
          class="bg-mauve-600 text-amber-50 px-4 py-2 rounded-lg hover:bg-mauve-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="deleteForm.invalid"
        >
          Delete Meal
        </button>
      </div>
    </form>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
    @for (meal of itemsService.items(); track meal.idMeal) {
      <div class="flex">
        <div class="flex flex-col h-full w-full rounded-xl border border-amber-200 bg-white overflow-hidden shadow-sm">
          <div class="flex flex-col flex-1 p-4">
            <h5 class="text-base font-semibold text-stone-800 mb-2">
              {{ meal.strMeal || 'N/A' }}
            </h5>
            <img
              class="object-cover h-full w-full rounded-lg"
              [src]="meal.strMealThumb"
              onerror="this.src = 'placeholder.svg'"
            />
          </div>
        </div>
      </div>
    }
  </div>

</div>
