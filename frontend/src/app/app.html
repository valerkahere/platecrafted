<header class="bg-mauve-600 text-amber-50 shadow-md">
  <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">

    <!-- Brand -->
    <a
      routerLink="/"
      class="text-lg font-bold tracking-wide text-amber-50 hover:text-amber-300 transition"
    >
      Platecrafted
    </a>

    <!-- Nav links -->
    <nav>
      <ul class="flex items-center gap-1 text-sm font-medium">
        <li>
          <a
            routerLink="/"
            routerLinkActive="bg-mauve-800 text-amber-300"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-4 py-2 rounded-lg text-amber-50 hover:bg-mauve-800 hover:text-amber-300 transition"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/alphabet"
            routerLinkActive="bg-mauve-800 text-amber-300"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-4 py-2 rounded-lg text-amber-50 hover:bg-mauve-800 hover:text-amber-300 transition"
          >
            Browse A–Z
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            routerLinkActive="bg-mauve-800 text-amber-300"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-4 py-2 rounded-lg text-amber-50 hover:bg-mauve-800 hover:text-amber-300 transition"
          >
            About
          </a>
        </li>
      </ul>
    </nav>

  </div>
</header>
<main>
  <router-outlet />
</main>
