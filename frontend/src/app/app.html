<div class=" bg-base">
<header class="bg-mauve-600 text-amber-50 shadow-md">
  <div
    class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3"
  >
    <!-- Brand -->
    <a
      routerLink="/"
      class="text-lg font-bold tracking-wide text-amber-50 transition hover:text-amber-300"
    >
      Platecrafted
    </a>

    <!-- Nav links -->
    <nav>
      <ul class="flex items-center gap-1 text-sm font-medium">
        <li>
          <a
            routerLink="/"
            routerLinkActive="bg-mauve-800 text-amber-300"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-lg px-4 py-2 text-amber-50 transition hover:bg-mauve-800 hover:text-amber-300"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/alphabet"
            routerLinkActive="bg-mauve-800 text-amber-300"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-lg px-4 py-2 text-amber-50 transition hover:bg-mauve-800 hover:text-amber-300"
          >
            Browse A–Z
          </a>
        </li>
        <li>
          <a
            routerLink="/favourites"
            routerLinkActive="bg-mauve-800 text-amber-300"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-lg px-4 py-2 text-amber-50 transition hover:bg-mauve-800 hover:text-amber-300"
          >
            My Favourites
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            routerLinkActive="bg-mauve-800 text-amber-300"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-lg px-4 py-2 text-amber-50 transition hover:bg-mauve-800 hover:text-amber-300"
          >
            About
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
<main>
  <router-outlet />
</main>
</div>
